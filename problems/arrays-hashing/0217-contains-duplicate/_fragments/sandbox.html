<div class="sandbox-container" id="sandbox2">
  <div class="sandbox-header"><span class="sandbox-dot"></span><span>Duplicate race: pairs, sort or set</span></div>
  <div class="sandbox-body">
    <div class="control-group">
      <label for="s2In">nums (up to 12 whole numbers, split by commas or spaces)</label>
      <input type="text" id="s2In" value="3, 8, 5, 1, 9, 5" spellcheck="false" autocomplete="off">
    </div>
    <div class="control-group">
      <label>Try an example</label>
      <div class="btn-row">
        <button class="btn btn-sm" type="button" data-s2ex="2, 9, 4, 1, 6, 3, 8, 5">No duplicates</button>
        <button class="btn btn-sm" type="button" data-s2ex="7, 7, 1, 2, 3, 4, 5, 6, 8, 9">Early duplicate</button>
        <button class="btn btn-sm" type="button" data-s2ex="4, 9, 2, 7, 5, 1, 8, 3, 6, 6">Late duplicate</button>
        <button class="btn btn-sm" type="button" data-s2ex="2, 2, 2, 2, 2">All the same</button>
        <button class="btn btn-sm" type="button" data-s2ex="">Empty list</button>
      </div>
    </div>
    <div class="control-group">
      <label>Approach to trace</label>
      <div class="btn-row" role="group" aria-label="Approach to trace">
        <button class="btn btn-sm" type="button" data-s2ap="pairs" aria-pressed="false">Pairs</button>
        <button class="btn btn-sm" type="button" data-s2ap="sort" aria-pressed="false">Sort</button>
        <button class="btn btn-sm btn-primary" type="button" data-s2ap="set" aria-pressed="true">Set</button>
      </div>
    </div>
    <div class="btn-row"><button class="btn btn-primary" type="button" id="s2Run">Run</button></div>
    <p class="sb-error" id="s2Err" role="alert"></p>
    <div id="s2Tp"></div>
    <div class="readout" id="s2Out" aria-live="polite"></div>
    <p class="sidebar-hint">The race counts the steps of all three approaches on your list, whichever one you trace. Sort steps count the comparisons Python's own sort makes. Try the early duplicate: the lucky pairs method wins there. Then try no duplicates and watch it lose.</p>
  </div>
</div>
