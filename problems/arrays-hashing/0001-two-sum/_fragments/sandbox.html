<div class="sandbox-container" id="sandbox3">
  <div class="sandbox-header"><span class="sandbox-dot"></span><span>Two Sum: run it on your numbers</span></div>
  <div class="sandbox-body">
    <div class="control-group">
      <label for="s3Nums">nums (whole numbers, separated by commas)</label>
      <input type="text" id="s3Nums" value="5, 9, 1, 12, 3, 8" autocomplete="off" spellcheck="false">
    </div>
    <div class="control-group">
      <label for="s3Target">target</label>
      <input type="text" id="s3Target" value="11" autocomplete="off" spellcheck="false">
    </div>
    <p class="sidebar-hint">Try an example:</p>
    <div class="btn-row">
      <button class="btn btn-sm" type="button" data-s3ex="classic">Classic</button>
      <button class="btn btn-sm" type="button" data-s3ex="ends">Pair at the ends</button>
      <button class="btn btn-sm" type="button" data-s3ex="dupes">Duplicates [3, 3]</button>
      <button class="btn btn-sm" type="button" data-s3ex="neg">Negatives</button>
      <button class="btn btn-sm" type="button" data-s3ex="trap">Self-pair trap</button>
    </div>
    <p class="sidebar-hint">Approach:</p>
    <div class="btn-row">
      <button class="btn btn-sm" type="button" data-s3ap="pairs" aria-pressed="false">Try every pair</button>
      <button class="btn btn-sm" type="button" data-s3ap="map" aria-pressed="true">One-pass map</button>
      <button class="btn btn-sm" type="button" data-s3ap="buggy" aria-pressed="false">Buggy map</button>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary btn-sm" type="button" id="s3Run">Run</button>
    </div>
    <p class="sb-error" id="s3Err" role="alert"></p>
    <div id="s3Player"></div>
    <div class="readout" id="s3Out" aria-live="polite"></div>
  </div>
</div>
